[project]
name = "ai4-booth-agent"
version = "1.0.0"
description = "AI4 booth voice agent (LiveKit port of rime-voice-agent)"
requires-python = ">=3.10,<3.15"
dependencies = [
    # STT via LiveKit Inference (keyless) is in agents core; extras add the
    # Anthropic LLM, Rime Coda TTS, Silero VAD, and turn detection.
    "livekit-agents[anthropic,rime,silero,turn-detector]~=1.6",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-openai>=1.6.7",
    "python-dotenv>=1.1.1",
]
