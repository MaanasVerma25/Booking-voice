<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rime Voice Demos: Industry Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Rime brand guidelines palette */
  :root {
    --paper: #F0E9DD;
    --paper-light: #F8F3EA;
    --paper-dark: #DDD6C9;
    --ink: #2E2A25;
    --ink-dark: #24211D;
    --ink-light: #3C372F;
    --muted: #6E675B;
    --aqua: #1DADC7;
    --yellow: #F0BE4D;
    --pink: #F08ADD;
    --green: #60C66A;
    --accent: #1DADC7;
    --accent-soft: rgba(29, 173, 199, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    background-color: var(--paper);
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='760' height='560'><circle cx='430' cy='150' r='190' fill='%231DADC7' style='mix-blend-mode:multiply'/><circle cx='610' cy='130' r='160' fill='%23F0BE4D' style='mix-blend-mode:multiply'/><circle cx='300' cy='280' r='170' fill='%23F08ADD' style='mix-blend-mode:multiply'/><circle cx='575' cy='305' r='120' fill='%2360C66A' style='mix-blend-mode:multiply'/></svg>");
    background-repeat: no-repeat;
    background-position: right -130px top -170px;
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }


  header, main, footer { position: relative; z-index: 1; }
  header {
    padding: 20px 28px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wordmark { display: block; }
  .wordmark .logo-svg { width: 108px; height: auto; display: block; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* --- Step screens --- */
  .step {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 24px;
  }
  @keyframes stepIn {
    from { opacity: 0; transform: translateY(16px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }
  body[data-step="1"] #step1,
  body[data-step="2"] #step2,
  body[data-step="3"] #step3 { display: flex; animation: stepIn 0.45s cubic-bezier(0.22, 1, 0.36, 1); }

  .step h2 {
    font-family: "Archivo Black", "Archivo", sans-serif;
    font-weight: 400;
    font-size: clamp(44px, 6vw, 76px);
    letter-spacing: -2.5px;
    line-height: 0.95;
    text-align: center;
    color: var(--ink);
  }
  .step .hint {
    color: var(--muted);
    font-size: 18px;
    font-weight: 500;
    margin-top: -16px;
  }

  .choice-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1100px;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.82) translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  .industry-btn {
    font-family: "Archivo Black", "Archivo", sans-serif;
    font-weight: 400;
    font-size: clamp(22px, 2.3vw, 30px);
    letter-spacing: -0.5px;
    color: var(--ink);
    background: var(--choice);
    border: none;
    border-radius: 28px;
    padding: 52px 48px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.16s ease;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  .industry-btn::after {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    right: -40px;
    bottom: -55px;
    background: rgba(248, 243, 234, 0.35);
  }
  .industry-btn::before {
    content: "";
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    left: -22px;
    top: -26px;
    background: rgba(36, 33, 29, 0.12);
  }
  .industry-btn:hover {
    transform: translateY(-6px) rotate(-1deg) scale(1.02);
  }
  .industry-btn:active { transform: translateY(-1px) scale(0.98); }

  .voice-btn {
    background: var(--paper-light);
    border: 2px solid var(--paper-dark);
    border-radius: 24px;
    padding: 26px 30px 24px;
    cursor: pointer;
    text-align: center;
    min-width: 210px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: transform 0.16s ease, border-color 0.16s ease;
    font-family: inherit;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  .voice-btn:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: var(--vc, var(--accent));
  }
  .voice-btn:active { transform: translateY(-1px) scale(0.98); }
  .vavatar {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--vc, var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Archivo Black", "Archivo", sans-serif;
    font-size: 27px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .voice-btn .vname {
    font-family: "Archivo Black", "Archivo", sans-serif;
    font-size: 24px;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  .voice-btn .vdesc { color: var(--muted); font-size: 14px; }
  .voice-btn .vtag {
    display: inline-block;
    margin-top: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 11px;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 999px;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .back-btn:hover { color: var(--ink); background: var(--paper-dark); }
  .back-btn.brand-cta {
    color: var(--ink);
    font-weight: 700;
    padding: 9px 20px;
  }
  .back-btn.brand-cta:hover { filter: brightness(1.08); transform: translateY(-2px); }

  /* --- Dropdowns (industry + voice switchers) --- */
  .dd { position: relative; }
  .dd-btn { border: none; cursor: pointer; font-family: inherit; }
  .dd-btn .caret { font-size: 12px; margin-left: 2px; }
  .dd-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--paper-light);
    border: 2px solid var(--paper-dark);
    border-radius: 18px;
    padding: 8px;
    min-width: 230px;
    display: none;
    z-index: 40;
  }
  .dd.open .dd-menu { display: block; animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .dd-item {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    padding: 11px 14px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: background 0.12s ease;
  }
  .dd-item:hover { background: var(--paper-dark); }
  .dd-item .swatch {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--sw, var(--accent));
    flex: none;
  }
  .dd-item .sub { font-weight: 500; font-size: 12.5px; color: var(--muted); }
  .dd-item .check { margin-left: auto; font-size: 13px; color: var(--muted); }

  /* --- Step 3: the call --- */
  #step3 { justify-content: flex-start; gap: 0; padding: 0; overflow: hidden; }
  #convoBar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 4px 24px 14px;
    flex-wrap: wrap;
  }
  #convoBar .pill {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: var(--choice, var(--accent-soft));
    border-radius: 999px;
    padding: 9px 20px;
  }
  #console {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: min(1400px, 94vw);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
  }
  #consoleInner {
    flex: 1;
    min-height: 0;
    background: var(--ink);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #consoleInner.pausable { cursor: pointer; } /* audio active: tap to pause/resume */
  #consoleBar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 22px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(248, 243, 234, 0.75);
    border-bottom: 1px solid rgba(248, 243, 234, 0.12);
  }
  #consoleBar .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: livePulse 2.2s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  #speakDots { display: inline-flex; gap: 5px; margin-left: 6px; opacity: 0; transition: opacity 0.25s ease; }
  #speakDots.on { opacity: 1; }
  #speakDots i { width: 7px; height: 7px; border-radius: 50%; animation: dotBounce 0.9s ease-in-out infinite; }
  #speakDots i:nth-child(1) { background: var(--aqua); }
  #speakDots i:nth-child(2) { background: var(--yellow); animation-delay: 0.15s; }
  #speakDots i:nth-child(3) { background: var(--pink); animation-delay: 0.3s; }
  @keyframes dotBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  #callTimer { margin-left: auto; font-weight: 500; }
  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(12px) scale(0.94); }
    to   { opacity: 1; transform: none; }
  }
  .bubble {
    padding: 13px 18px 15px;
    border-radius: 16px;
    max-width: 72%;
    line-height: 1.65;
    font-size: 15px;
    animation: bubbleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .blabel {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0.65;
  }
  .user {
    background: var(--paper-light);
    color: var(--ink);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    transform-origin: bottom right;
  }
  .agent {
    background: var(--ink-light);
    color: var(--paper-light);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    transform-origin: bottom left;
    position: relative;
    transition: filter 0.15s ease;
  }
  /* The replay affordance appears only once the reply's audio clip is
     actually captured and clickable — no dead ↻ hints. */
  .bubble.agent.replayable { cursor: pointer; padding-right: 34px; }
  .bubble.agent.replayable:hover { filter: brightness(1.18); }
  .bubble.agent.replayable::after {
    content: "\21BB"; /* ↻ replay hint */
    position: absolute;
    right: 12px;
    bottom: 8px;
    font-size: 13px;
    opacity: 0.35;
    transition: opacity 0.15s ease;
  }
  .bubble.agent.replayable:hover::after { opacity: 0.85; }
  .bubble.agent.replaying { filter: brightness(1.22); }
  .bubble.agent.replaying::after { opacity: 1; }
  .interim { opacity: 0.55; font-style: italic; }
  .error {
    background: #F5E0D8;
    border: 1px solid #DEB3A2;
    color: #8C3B28;
    align-self: center;
    font-size: 14px;
  }
  #chips {
    display: flex;
    gap: 9px;
    flex-wrap: nowrap; /* one tidy row along the bottom of the conversation */
    justify-content: center;
    max-width: min(1400px, 94vw);
    margin: 0 auto;
    padding: 14px 24px 4px;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .chip {
    border: none;
    background: var(--paper-dark); /* flat, no shading or shadows */
    color: var(--ink);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.14s ease, background 0.14s ease;
  }
  .chip:hover { transform: translateY(-3px); }
  .chip:active { transform: translateY(0) scale(0.97); }

  footer {
    display: none;
    padding: 10px 24px 22px;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  body[data-step="3"] footer { display: flex; }
  /* The mic stays put; the pause button floats in beside it without
     affecting layout, so nothing shifts when it appears or disappears. */
  .talk-row { position: relative; display: flex; align-items: center; justify-content: center; }
  .round-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--ink);
    font-size: 26px;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .round-btn:hover { transform: scale(1.08); filter: brightness(1.06); }
  .round-btn:active { transform: scale(0.96); }
  /* Recording: the mic becomes a pulsing pink stop button */
  #micBtn .icon-stop { display: none; }
  body.rec #micBtn { background: var(--ink); color: var(--pink); animation: pulse 1.2s infinite; }
  body.rec #micBtn .icon-mic { display: none; }
  body.rec #micBtn .icon-stop { display: block; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(240, 138, 221, 0.55); }
    70% { box-shadow: 0 0 0 26px rgba(0, 0, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
  }
  /* Agent talking: the conversation lights up in the industry color */
  body.talking #consoleInner { outline: 3px solid var(--accent); outline-offset: -3px; }
  #status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: var(--muted);
    font-size: 14px;
    min-height: 36px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 999px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  #stateDot, #stateEq { display: none; }
  body.rec #status {
    background: var(--ink);
    color: var(--paper-light);
    font-weight: 700;
    font-size: 15px;
  }
  body.rec #stateDot {
    display: block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--pink);
    animation: recBlink 1s ease-in-out infinite;
  }
  @keyframes recBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  body.talking:not(.rec) #status {
    background: var(--accent);
    color: var(--ink);
    font-weight: 700;
    font-size: 15px;
  }
  body.talking:not(.rec) #stateEq { display: inline-flex; align-items: flex-end; gap: 3px; height: 15px; }
  #stateEq i { width: 4px; border-radius: 2px; background: var(--ink); height: 6px; animation: eqBounce 0.8s ease-in-out infinite; }
  #stateEq i:nth-child(2) { animation-delay: 0.18s; }
  #stateEq i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes eqBounce { 0%, 100% { height: 5px; } 50% { height: 15px; } }
  .row { display: flex; gap: 10px; align-items: center; }
  #textInput {
    background: var(--paper-light);
    border: 2px solid var(--paper-dark);
    color: var(--ink);
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 15px;
    width: 380px;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  #textInput:focus { outline: none; border-color: var(--accent); }
  #textInput::placeholder { color: var(--muted); }
  #sendBtn {
    background: var(--ink);
    border: none;
    color: var(--paper);
    border-radius: 999px;
    padding: 13px 26px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  #sendBtn:hover { opacity: 0.88; transform: translateY(-2px); }

  @media (prefers-reduced-motion: reduce) {
    .industry-btn, .voice-btn, .bubble, .step, #micBtn,
    #consoleBar .dot, #speakDots i, #stateDot, #stateEq i { animation: none !important; }
  }
</style>
</head>

<header>

</header>

<main>
  <section class="step" id="step1">
    <h2>Start the<br>conversation</h2>
    <div class="hint">Pick an industry and talk to a Rime voice</div>
    <div class="choice-row" id="industryRow"></div>
  </section>

  <section class="step" id="step2">
    <h2>Pick your voice</h2>
    <div class="choice-row" id="voiceRow"></div>
    <button class="back-btn" id="backToIndustries">&larr; Back to industries</button>
  </section>

  <section class="step" id="step3">
    <div id="convoBar">
      <div class="dd" id="industryDD">
        <button class="pill dd-btn" id="industryPill"></button>
        <div class="dd-menu" id="industryMenu"></div>
      </div>
      <div class="dd" id="voiceDD">

// Strip expressive tokens (<laugh>) and stress markers from the visible caption
function displayText(text) {
  return (text || "").replace(/<[^<>]+>/g, "").replace(/\*/g, "").replace(/\s{2,}/g, " ").trim();
}

function addBubble(cls, text) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;

  label.className = "blabel";

  if (cls.startsWith("agent") || cls.startsWith("user")) div.appendChild(label);

  body.textContent = cls.startsWith("agent") ? displayText(text) : text;
  div.appendChild(body);
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;

function setStatus(text) { stateTextEl.textContent = text; }
function setSpeaking(on) {
  document.body.classList.toggle("talking", on);

// ===== LiveKit engine (push-to-talk) =====
const { Room, RoomEvent, Track } = LivekitClient;
let room = null;
let talking = false;       // is the visitor's turn live (mic hot)?
let agentIdentity = null;  // the LiveKit agent participant (RPC target)
const segBubbles = new Map(); // transcription segment id -> bubble element

// ===== Replay: capture the agent's live audio so past replies can be
// re-heard. One MediaRecorder per reply: the recorder is restarted after
// each speaking turn, so every reply becomes its own self-contained blob
// that plays from byte zero — no offsets, no seeking. (Offsets into one long
// recording don't work: between turns the remote track sends no frames, so
// the recording's media timeline is shorter than wall-clock and drifts a
// little further behind with every silence.) =====
let recorder = null;
let recChunks = [];
let recStream = null;        // the agent audio stream the recorders draw from
let curTurn = null;          // { bubbles: Set } while the agent speaks
let turnEndTimer = null;     // debounce so level dips don't split one reply
let replayCtx = null;        // Web Audio context for trimmed replay playback
let replaySource = null;     // active replay AudioBufferSourceNode
let replayingBubble = null;
let replayQueue = [];        // fragment blobs still to play for this replay

function startRecorder(track) {
  stopRecorder();
  try {
    recStream = new MediaStream([track.mediaStreamTrack]);
    spinUpRecorder();
  } catch (_) {
    recorder = null; // no replay affordance, live audio unaffected
  }
}

function spinUpRecorder() {
  if (!recStream) return;
  try {
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
    recorder = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined);
    recChunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.start(250);
  } catch (_) {
    recorder = null;
  }
}

function stopRecorder() {
  if (recorder) {
    recorder.ondataavailable = null;
    recorder.onstop = null;
    try { if (recorder.state !== "inactive") recorder.stop(); } catch (_) {}
  }
  recorder = null;
  recChunks = [];
  recStream = null;
  clearTimeout(turnEndTimer);
  turnEndTimer = null;
  curTurn = null;
}

// Drop idle audio accumulated since the last reply so each reply's blob
// stays small and decodes fast. Called when the visitor sends a message —
// a moment when the agent is guaranteed not to be mid-reply.
function restartIdleRecorder() {
  if (!recStream || curTurn || turnEndTimer) return;
  if (recorder) {
    recorder.ondataavailable = null;
    recorder.onstop = null;
    try { if (recorder.state !== "inactive") recorder.stop(); } catch (_) {}
  }
  spinUpRecorder();
}

function onAgentSpeakingChange(speaking) {
  if (!recorder) return;
  if (speaking) {
    if (turnEndTimer) { clearTimeout(turnEndTimer); turnEndTimer = null; return; } // same turn continues
    if (!curTurn) {
      curTurn = { bubbles: new Set() };
      // Transcription text can land just before the speaking event; adopt the
      // newest agent bubble that isn't replayable yet so it isn't orphaned.
      const orphans = transcriptEl.querySelectorAll(".bubble.agent:not(.replayable)");
      if (orphans.length) curTurn.bubbles.add(orphans[orphans.length - 1]);
    }
  } else if (curTurn && !turnEndTimer) {
    // Wait out level dips (Rime voices pause naturally mid-reply) before
    // treating the silence as the end of the reply.
    turnEndTimer = setTimeout(finalizeTurn, 1000);
  }
}

function finalizeTurn() {
  turnEndTimer = null;
  const turn = curTurn;
  curTurn = null;
  if (!turn || !recorder || recorder.state === "inactive") return;
  let targets = [...turn.bubbles];
  if (!targets.length) {
    // No transcript segments updated during this speech: it was the tail of
    // the previous reply, whose text had already streamed in ahead of the
    // audio. Attribute it to the newest agent bubble (fragments chain there).
    const all = transcriptEl.querySelectorAll(".bubble.agent");
    if (all.length) targets = [all[all.length - 1]];
  }
  // Stop the recorder to flush its final chunk, hand the finished blob to the
  // reply's bubble(s), then start a fresh recorder for the next reply.
  const rec = recorder;
  rec.onstop = () => {
    const blob = new Blob(recChunks, { type: (recChunks[0] && recChunks[0].type) || "audio/webm" });
    if (blob.size) for (const bubble of targets) makeReplayable(bubble, blob);
    spinUpRecorder();
  };
  try { rec.stop(); } catch (_) { spinUpRecorder(); }
}

function makeReplayable(bubble, blob) {
  if (!bubble || !bubble.isConnected) return;
  // A long mid-reply pause can split one reply across two recorder turns;
  // fragments chain onto the same bubble and replay plays them in sequence.
  if (!bubble._blobs) bubble._blobs = [];
  bubble._blobs.push(blob);
  bubble.classList.add("replayable");
  bubble.title = "Tap to hear this again";
  bubble.onclick = () => {
    if (document.body.classList.contains("talking")) return; // live speech wins
    if (talking) return;                                     // mic turn in progress
    replayBubble(bubble);
  };
}

function stopReplay() {
  replayQueue = [];
  if (replaySource) {
    replaySource.onended = null;
    try { replaySource.stop(); } catch (_) {}
    replaySource = null;
  }
  if (replayingBubble) { replayingBubble.classList.remove("replaying"); replayingBubble = null; }
}

function replayBubble(bubble) {
  stopReplay();
  if (!bubble._blobs || !bubble._blobs.length) return;
  replayingBubble = bubble;
  bubble.classList.add("replaying");
  setStatus("Replaying…");
  replayQueue = bubble._blobs.slice();
  playNextReplayBlob();
}

// First/last 10ms window whose RMS clears the floor — the speech bounds
// inside a recording that may carry idle room silence around the reply.
function findSpeechBounds(ch, sampleRate) {
  const hop = Math.floor(sampleRate / 100); // 10ms
  const rmsAt = (i) => {
    let sum = 0;
    const end = Math.min(i + hop, ch.length);
    for (let j = i; j < end; j++) sum += ch[j] * ch[j];
    return Math.sqrt(sum / Math.max(1, end - i));
  };
  let first = -1;
  for (let i = 0; i < ch.length; i += hop) { if (rmsAt(i) > 0.01) { first = i; break; } }
  if (first < 0) return null;
  let last = first;
  for (let i = ch.length - hop; i >= first; i -= hop) { if (rmsAt(i) > 0.01) { last = Math.min(ch.length, i + hop); break; } }
  return { first, last };
}

async function playNextReplayBlob() {
  const blob = replayQueue.shift();
  if (!blob) {
    stopReplay();
    setStatus(talking ? "Listening… tap the mic to send" : "Tap the mic to talk");
    return;
  }
  // Decode and play just the speech: the recorder may capture idle silence
  // before the reply (the track isn't always DTX-muted between turns), and
  // replay must start with the first word, not with recorded dead air.
  try {
    if (!replayCtx) replayCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (replayCtx.state === "suspended") await replayCtx.resume();
    const buf = await replayCtx.decodeAudioData(await blob.arrayBuffer());
    const bounds = findSpeechBounds(buf.getChannelData(0), buf.sampleRate);
    if (!bounds) { playNextReplayBlob(); return; } // all silence; next fragment
    const startSec = Math.max(0, bounds.first / buf.sampleRate - 0.15);
    const durSec = Math.min(buf.duration, bounds.last / buf.sampleRate + 0.25) - startSec;
    const src = replayCtx.createBufferSource();
    src.buffer = buf;
    src.connect(replayCtx.destination);
    replaySource = src;
    src.onended = () => {
      if (replaySource !== src) return; // a newer replay or stopReplay took over
      replaySource = null;
      playNextReplayBlob();
    };
    src.start(0, startSec, durSec);
  } catch (_) {
    playNextReplayBlob(); // skip an undecodable fragment rather than dying
  }
}

function wireRoom(r) {
  r.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
    if (participant) agentIdentity = participant.identity; // the agent
    if (track.kind === Track.Kind.Audio) {
      const el = track.attach();
      el.autoplay = true;
      el.style.display = "none";
      document.body.appendChild(el);
      // Trade ~150ms of extra playout delay for smoothness: on busy venue
      // wifi the default adaptive jitter buffer runs tight, and every late
      // packet becomes an audible hiccup mid-word.
      if (track.receiver && "jitterBufferTarget" in track.receiver) {
        try { track.receiver.jitterBufferTarget = 150; } catch (_) {}
      }
      startRecorder(track); // capture for replay
    }
  });
  r.on(RoomEvent.ParticipantConnected, (p) => { agentIdentity = p.identity; });
  r.on(RoomEvent.TrackUnsubscribed, (track) => {
    stopRecorder();
    track.detach().forEach((el) => el.remove());
  });
  r.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
    const agentSpeaking = speakers.some((p) => p.identity !== r.localParticipant.identity);
    setSpeaking(agentSpeaking);
    if (agentSpeaking) stopReplay(); // live speech takes over from any replay
    onAgentSpeakingChange(agentSpeaking);
    if (agentSpeaking) setStatus(currentVoiceName() + " is speaking…");
    else if (!talking) setStatus("Tap the mic to talk");
  });
  r.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
    const isAgent = participant && participant.identity !== r.localParticipant.identity;
    for (const seg of segments) {
      const cls = isAgent ? "agent" : "user";
      let bubble = segBubbles.get(seg.id);
      if (!bubble) { bubble = addBubble(cls, seg.text); segBubbles.set(seg.id, bubble); }
      else { bubble.lastChild.textContent = isAgent ? displayText(seg.text) : seg.text; }
      if (isAgent && curTurn) curTurn.bubbles.add(bubble); // this reply's clip
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }
  });
  r.on(RoomEvent.Connected, () => setStatus("Tap the mic to talk"));
  r.on(RoomEvent.Disconnected, () => { setSpeaking(false); });
  // Surface network trouble instead of leaving unexplained silence: venue
  // wifi hiccups now say so on screen while LiveKit reconnects on its own.
  r.on(RoomEvent.Reconnecting, () => setStatus("Wifi hiccup — reconnecting…"));
  r.on(RoomEvent.Reconnected, () => setStatus(talking ? "Listening… tap the mic to send" : "Tap the mic to talk"));
  r.on(RoomEvent.ConnectionQualityChanged, (quality, participant) => {
    if (participant !== r.localParticipant) return;
    const bad = quality === "poor" || quality === "lost";
    document.body.classList.toggle("net-poor", bad);
    if (bad && !talking && !document.body.classList.contains("talking")) {
      setStatus("Venue wifi is struggling — replies may take a moment…");
    }
  });
}

// Call one of the agent's push-to-talk RPC methods (start_turn / end_turn / cancel_turn).
async function callAgent(method) {
  if (!room || !agentIdentity) return;
  try {
    await room.localParticipant.performRpc({ destinationIdentity: agentIdentity, method, payload: "" });
  } catch (err) { console.error("rpc", method, err); }
}

async function beginCall() {
  await endCall();
  talking = false;
  document.body.classList.remove("rec");
  setStatus("Connecting…");
  try {
    const resp = await fetch("/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ industry: currentIndustry, voice: currentVoice }),
    });
    if (!resp.ok) throw new Error("token request failed (" + resp.status + ")");
    const data = await resp.json();
    if (data.mock) {
      startMockCall(data);
      return;
    }
    const { serverUrl, token } = data;
    room = new Room({ adaptiveStream: true, dynacast: true });
    wireRoom(room);
    await room.connect(serverUrl, token);
    // Publish the mic (asks permission up front) but keep it muted; push-to-talk
    // unmutes it only for the visitor's turn.
    await room.localParticipant.setMicrophoneEnabled(true);
    await room.localParticipant.setMicrophoneEnabled(false);
  } catch (err) {
    console.error(err);
    setStatus("Couldn't start the call. Tap Start over to retry.");
    addBubble("error", "Connection failed: " + (err.message || err));
  }
}

    "Certainly. I can assist with checking account balances or reviewing your recent transactions. Which account would you like to view?",
    "Our high-yield savings accounts currently earn competitive APY and are fully FDIC insured up to two hundred fifty thousand dollars.",
    "I have processed that request for your account. Your security and peace of mind are our priority at Meridian Trust."
  ],
  food: [
    "Awesome choice! Our double bacon burger with smoky ranch is unbelievable! Want to make that a combo with waffle fries and a shake?",
    "Coming right up! That total comes to fourteen dollars and fifty-five cents. Your order will be ready at the window in about five minutes!",
    "You got it! Extra ranch added. Anything else to quench your thirst today?"
  ],
  retail: [
    "We have a wonderful new seasonal collection at Harbor & Pine! Are you looking for outerwear, casual wear, or accessories today?",
    "That item is currently in stock! We also offer free sixty-day returns and exchanges in store.",
    "Great pick! Let me reserve that for you at the front register."
  ]
};

let mockReplyIdx = 0;

let recognition = null;
let mockTranscript = "";

function startMockCall(data) {
  room = {
    mock: true,
    localParticipant: {
      setMicrophoneEnabled: async () => {},
      performRpc: async () => {},
      sendText: async (txt) => { handleMockUserMessage(txt); }
    },
    disconnect: async () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (recognition) { try { recognition.stop(); } catch(_) {} recognition = null; }
    }
  };
  setStatus("Connected (Demo Mode) • Ready");
  const greeting = MOCK_GREETINGS[currentIndustry] || MOCK_GREETINGS.healthcare;
  setTimeout(() => {
    addBubble("agent", greeting);
    speakMockText(greeting);
  }, 400);
}

function speakMockText(text) {
  setSpeaking(true);
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/<[^>]*>/g, '');
    const utter = new SpeechSynthesisUtterance(cleanText);
    utter.onend = () => setSpeaking(false);
    utter.onerror = () => setSpeaking(false);
    window.speechSynthesis.speak(utter);
  } else {
    setTimeout(() => setSpeaking(false), 2500);
  }
}

function handleMockUserMessage(text) {
  setStatus(currentVoiceName() + " is thinking…");
  setTimeout(() => {
    const list = MOCK_REPLIES[currentIndustry] || MOCK_REPLIES.healthcare;
    const reply = list[mockReplyIdx % list.length];
    mockReplyIdx++;
    addBubble("agent", reply);
    speakMockText(reply);
    setStatus("Connected (Demo Mode) • Tap mic to talk");
  }, 800);
}

async function endCall() {
  setSpeaking(false);
  stopReplay();
  stopRecorder();
  segBubbles.clear();
  talking = false;
  document.body.classList.remove("rec");
  if (recognition) { try { recognition.stop(); } catch(_) {} recognition = null; }
  if (room) { try { await room.disconnect(); } catch (e) {} room = null; }
  agentIdentity = null;
  if (transcriptEl) transcriptEl.innerHTML = "";
}

// End a live mic turn without sending it (used before a chip / typed message).
async function cancelTurn() {
  if (!talking) return;
  talking = false;
  document.body.classList.remove("rec");
  if (recognition) { try { recognition.stop(); } catch(_) {} recognition = null; }
  if (room && !room.mock) await room.localParticipant.setMicrophoneEnabled(false);
  await callAgent("cancel_turn");
}

// Chips + typed text arrive as a user message (cancels any live mic turn first).
async function sendUserText(text) {
  text = (text || "").trim();
  if (!text || !room) return;
  stopReplay();
  await cancelTurn();
  restartIdleRecorder();
  addBubble("user", text);
  if (room.mock) {
    handleMockUserMessage(text);
    return;
  }
  try { await room.localParticipant.sendText(text, { topic: "lk.chat" }); }
  catch (err) { console.error("sendText failed", err); }
}

// Push-to-talk: tap to talk, tap again to send.
micBtn.addEventListener("click", async () => {
  if (!room) return;
  if (room.mock) {
    if (!talking) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      mockTranscript = "";
      talking = true;
      document.body.classList.add("rec");
      setStatus("Listening… speak into mic, then tap mic to send");

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        try {
          recognition = new SpeechRec();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = "en-US";
          recognition.onresult = (ev) => {
            let resStr = "";
            for (let i = ev.resultIndex; i < ev.results.length; i++) {
              resStr += ev.results[i][0].transcript;
            }
            if (resStr.trim()) {
              mockTranscript = resStr;
              setStatus("Hearing: \"" + resStr.trim() + "\"");
            }
          };
          recognition.onerror = (err) => console.warn("SpeechRec error:", err);
          recognition.start();
        } catch (e) {
          console.warn("Could not start SpeechRecognition:", e);
        }
      }
    } else {
      talking = false;
      document.body.classList.remove("rec");
      if (recognition) {
        try { recognition.stop(); } catch(_) {}
        recognition = null;
      }
      const spokenText = mockTranscript.trim() || "Hello, I have a question.";
      addBubble("user", spokenText);
      handleMockUserMessage(spokenText);
    }
    return;
  }
  if (!talking) {
    stopReplay();
    talking = true;
    document.body.classList.add("rec");
    setStatus("Listening… tap the mic to send");
    await room.localParticipant.setMicrophoneEnabled(true);
    await callAgent("start_turn");
  } else {
    talking = false;
    document.body.classList.remove("rec");
    setStatus(currentVoiceName() + " is thinking…");
    await room.localParticipant.setMicrophoneEnabled(false);
    restartIdleRecorder();
    await callAgent("end_turn");
  }
});

sendBtn.addEventListener("click", () => { sendUserText(textInput.value); textInput.value = ""; });
textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { sendUserText(textInput.value); textInput.value = ""; } });

showStep(1);
</script>
